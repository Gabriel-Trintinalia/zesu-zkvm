# Throwaway: check that ere-server-zisk keygen accepts the guest the 2026-10-12
# benchmark measured -- zesu's zisk-object (rv64im+Zbb+Zbs) linked against
# libziskos built by zisk/Makefile (with +unaligned-scalar-mem, #50). Pins copied
# from release.yml. Runs on push to this branch (workflow_dispatch needs the
# default branch).
name: Keygen check (zisk-object)

on:
  push:
    branches: [ci/keygen-zisk-object-436a1e9]
  workflow_dispatch:

env:
  ZISK_VERSION: "1.2.0-alpha"
  ERE_TAG: "0.18.0"
  ZESU_REF: "436a1e91da5bd507c2075d6000ad24307d4656f5"

jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 0xPolygonHermez/zisk
          ref: v${{ env.ZISK_VERSION }}
          path: upstream-zisk
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Consensys-Incorporated/zesu
          ref: ${{ env.ZESU_REF }}
          path: zesu
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-zisk runtime deps
        run: sudo apt-get install -y libomp5 libopenmpi3t64
      - name: Install cargo-zisk
        run: |
          ZISK_BIN_DIR="${HOME}/.config/.zisk/bin"
          mkdir -p "$ZISK_BIN_DIR"
          curl -fsSL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/ziskup" -o "$ZISK_BIN_DIR/ziskup"
          chmod +x "$ZISK_BIN_DIR/ziskup"
          "$ZISK_BIN_DIR/ziskup" --cpu --nokey
          echo "$ZISK_BIN_DIR" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install Zisk Rust toolchain
        run: cargo +zisk --version 2>/dev/null || cargo-zisk toolchain install
      - name: Build libziskos_staticlib.a (Makefile, with the #50 flag; no cache)
        working-directory: zisk
        run: make lib/libziskos_staticlib.a ZISK_DIR=$GITHUB_WORKSPACE/upstream-zisk
      - name: Build zesu zisk-object
        working-directory: zesu
        run: zig build zisk-object -Doptimize=ReleaseFast
      - name: Link the ZisK ELF
        working-directory: zisk
        run: zig build -Doptimize=ReleaseFast -Dzesu_obj=$GITHUB_WORKSPACE/zesu/zig-out/lib/zesu-zisk.o
      - name: Record what is under test
        run: |
          {
            echo "zesu $(git -C zesu rev-parse HEAD) (zisk-object), zesu-zkvm $(git rev-parse HEAD), zisk $ZISK_VERSION, ere $ERE_TAG"
            echo "libziskos_staticlib.a sha256 $(sha256sum zisk/lib/libziskos_staticlib.a | cut -d' ' -f1)"
            echo "ELF sha256 $(sha256sum zisk/zig-out/bin/zesu-zisk | cut -d' ' -f1)"
            python3 - <<'PY'
          import re
          d = open('zisk/zig-out/bin/zesu-zisk', 'rb').read()
          m = re.search(rb'rv64[a-z0-9_]+', d)
          print('arch', m.group().decode() if m else None)
          PY
          } >> $GITHUB_STEP_SUMMARY
          cat $GITHUB_STEP_SUMMARY
      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
      - name: Generate program VK (the actual check)
        run: |
          docker pull "ghcr.io/eth-act/ere/ere-server-zisk:${{ env.ERE_TAG }}"
          docker run --rm -v "${{ github.workspace }}/zisk/zig-out/bin:/output" \
            "ghcr.io/eth-act/ere/ere-server-zisk:${{ env.ERE_TAG }}" \
            --elf-path /output/zesu-zisk keygen --program-vk-path /output/zesu-zisk.vk
          ls -la zisk/zig-out/bin/
          echo "keygen OK: VK $(sha256sum zisk/zig-out/bin/zesu-zisk.vk | cut -d' ' -f1)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zesu-zisk-436a1e9-keygen
          path: |
            zisk/zig-out/bin/zesu-zisk
            zisk/zig-out/bin/zesu-zisk.vk
